name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Throwaway database that exists only inside the e2e job's service container.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anor
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/anor
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DEMO_MODE: "true"
  NEXT_PUBLIC_DEMO_MODE: "true"
  STORAGE_LOCAL_DIR: ./storage/uploads
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Messages (uz, ru, generated uz-Cyrl)
        run: npm run i18n
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The worker and cron jobs run outside Next.js: every job module must load in plain Node.
      - name: Jobs load outside Next.js
        run: npm run job -- --list

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The production server refuses to start with placeholder secrets: make throwaway ones.
      - name: Generate per-run secrets
        run: |
          for pair in "SESSION_SECRET:$(openssl rand -base64 48)" "SUPER_ADMIN_LOGIN:ci_owner_$(openssl rand -hex 3)" "SUPER_ADMIN_PASSWORD:$(openssl rand -base64 24)" "SUPER_ADMIN_ACCESS_CODE:$(openssl rand -hex 6)" "CRON_SECRET:$(openssl rand -hex 24)"; do
            key="${pair%%:*}"; value="${pair#*:}"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Database
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - run: npm run build
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
